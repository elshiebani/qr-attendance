<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الحضور</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #reader { width: 100%; max-width: 400px; margin: 20px auto; }
    .status { font-weight: bold; font-size: 1.2rem; margin-top: 15px; }
  </style>
</head>
<body>
  <h3>تسجيل الحضور اليومي</h3>
  <input type="text" id="studentId" placeholder="أدخل رقمك الدراسي" value="22001" style="padding: 8px; margin-bottom: 10px;">
  
  <div id="reader"></div>
  <div id="status" class="status"></div>

  <script>
    function onScanSuccess(decodedText) {
      const studentId = document.getElementById('studentId').value;
      if(!studentId) {
        alert("يرجى إدخال الرقم الدراسي أولاً");
        return;
      }

      html5QrcodeScanner.clear();

      fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: decodedText, studentId: studentId })
      })
      .then(res => res.json())
      .then(data => {
        const statusDiv = document.getElementById('status');
        if(data.success) {
          statusDiv.style.color = "green";
          statusDiv.innerText = data.message;
        } else {
          statusDiv.style.color = "red";
          statusDiv.innerText = data.message;
        }
      });
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
