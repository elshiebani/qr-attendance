<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور - الطالب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h3 { color: #333; margin-bottom: 15px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            background-color: #198754;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #157347; }
        #reader { width: 100%; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        #status { margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>تسجيل الحضور الذكي</h3>
        <input type="text" id="studentId" placeholder="أدخل رقم القيد">
        <button onclick="startScanner()">فتح الكاميرا ومسح الـ QR</button>
        
        <div id="reader"></div>
        <div id="status"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        const socket = io();
        let html5QrCode;

        async function startScanner() {
            const studentId = document.getElementById('studentId').value.trim();
            if (!studentId) {
                alert("يرجى كتابة رقم القيد أولاً");
                return;
            }

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "جاري تشغيل الكاميرا...";
            statusDiv.style.color = "#0d6efd";

            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");

            // إعدادات اختيار الكاميرا الخلفية (facingMode: "environment")
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            html5QrCode.start(
                { facingMode: "environment" }, // طلب الكاميرا الخلفية تلقائياً
                config,
                (decodedText) => {
                    // إرسال الرمز القارئ ورقم القيد للسيرفر
                    socket.emit('register-attendance', { token: decodedText, studentId: studentId });
                    html5QrCode.stop();
                },
                (errorMessage) => {
                    // أخطاء القراءة أثناء البحث عن كود
                }
            ).catch(err => {
                // في حال عدم توفر كاميرا خلفية يفتح المتاحة
                html5QrCode.start({ facingMode: "user" }, config, (decodedText) => {
                    socket.emit('register-attendance', { token: decodedText, studentId: studentId });
                    html5QrCode.stop();
                });
            });
        }

        socket.on('attendance-response', (data) => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = data.message;
            statusDiv.style.color = data.success ? "green" : "red";
        });
    </script>
</body>
</html>
