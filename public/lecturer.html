<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شاشة المحاضر - رمز الحضور</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f6f9; padding-top: 50px; }
    #qrcode { display: inline-block; margin-top: 20px; padding: 20px; background: white; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>امسح الرمز لتسجيل الحضور</h2>
  <p>الرمز يتغير تلقائياً كل 5 ثوانٍ لمنع التداول</p>
  <div id="qrcode"></div>

  <script>
    const socket = io();
    const qrContainer = document.getElementById("qrcode");
    let qrcode = new QRCode(qrContainer, { width: 256, height: 256 });

    socket.on('new_qr', (data) => {
      qrcode.makeCode(data.token);
    });
  </script>
</body>
</html>
