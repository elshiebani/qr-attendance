<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المحاضر - تسجيل الحضور</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .qr-box {
            background: #fff;
            padding: 15px;
            border: 2px dashed #0d6efd;
            border-radius: 8px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 250px;
            min-height: 250px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>امسح الرمز لتسجيل الحضور</h2>
        <p>الرمز يتغير تلقائياً كل 5 ثوانٍ لمنع التداول</p>
        
        <div class="qr-box">
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- استدعاء المكتبات الموثوقة -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        const socket = io();
        const qrContainer = document.getElementById('qrcode');
        let qrCodeObj = null;

        socket.on('qr-update', (token) => {
            // تفريغ المربع أول مرة ثم إعادة الرسم
            if (!qrCodeObj) {
                qrContainer.innerHTML = '';
                qrCodeObj = new QRCode(qrContainer, {
                    text: token,
                    width: 230,
                    height: 230
                });
            } else {
                qrCodeObj.makeCode(token);
            }
        });
    </script>
</body>
</html>
